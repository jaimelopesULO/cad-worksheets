<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa-solid fa-house"></i> Home Sweet Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="history.html">History</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h1 class="text-center mb-4">History</h1>

        <div class="table-responsive">
            <table class="table table-striped table-hover table-bordered align-middle">
                <caption>Latest events from the house sensors</caption>
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Category</th>
                        <th scope="col">State</th>
                        <th scope="col">Last Changed</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Kitchen lights</td>
                        <td><span class="badge text-bg-secondary">Off</span></td>
                        <td>23:40 2018-09-16</td>
                    </tr>
                    <tr>
                        <td>Kitchen lights</td>
                        <td><span class="badge text-bg-success">On</span></td>
                        <td>20:30 2018-09-16</td>
                    </tr>
                    <tr>
                        <td>Weather</td>
                        <td><span class="badge text-bg-warning">Sunset</span></td>
                        <td>20:35 2018-09-16</td>
                    </tr>
                    <tr>
                        <td>Bell</td>
                        <td><span class="badge text-bg-info">Ring</span></td>
                        <td>19:30 2018-09-16</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
